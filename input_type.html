<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <h1> Form Details </h1>
    <hr>
    
    <form>

        <label> First Name </label>
        <input type="text">
        <br><br>

        <label> Middle Name </label>
        <input type="text">
        <br><br>

        <label> Last Name </label>
        <input type="text" placeholder="Enter Last Name">
        <br><br>

        <label> Mobile Number </label>
        <input type="number" placeholder="Enter Mobile Number">
        <br><br>

        <label> Enter Password </label>
        <input type="password" placeholder="Enter Password">
        <br><br>

        <label> Choose Cities</label>
        <input type="checkbox" checked>Mumbai
        <input type="checkbox">Pune
        <input type="checkbox">Nagpur
        <input type="checkbox">Nashik
        <br><br>

        <label> Gender </label>
        <input type="radio" name="gender">Male
        <input type="radio" name="gender">Female
        <input type="radio" name="gender">Other
        <br><br>

        <label> Date And time</label>
        <input type="date">
        <input type="month">
        <input type="week">
        <input type="time">
        <input type="datetime-local">
        <br><br>

        <label> Upload Docs </label>
        <input type="file" multiple>
        <br><br>

        <label>Select your Fav Sweet Dish</label>
        <select>
             <option>choose dish..</option>
             <option>kajukatli</option>
             <option>Gulabjam</option>
             <option>Rasgulla</option>
             <option>Soan Papdi</option>
             <option>Jalebi</option>
             <option>Rasmalai</option>
        </select>
        <br><br>

        <label>Range</label>
        500<input type="range"  min="500" max="5000">5000
        <br><br>

        <label> select color </label>
        <input type="color">
        <br><br>

        Address <textarea rows="10" cols="50"></textarea>
        <br><br>

        <input type="Reset" value="Reset">
        <input type="submit" value="Submit">
        <input type="button" value="Submit">

    </form>
    <hr>
    <br><br>

    <fieldset>

        <legend> Contact Form </legend>

            <form>
                 <label>Name</label>
                 <input type="text"><br><br>
                 <label>Email</label>
                 <input type="email"><br><br>
                 <label>Phone </label>
                 <input type="Number"><br><br>
                 <label>Pincode</label>
                 <input type="number"><br><br>
                 <label>Address</label>
                 <textarea rows="10" cols="30"></textarea><br><br>
                 <input type="submit">
            </form>

    </fieldset>

</body>

</html>
